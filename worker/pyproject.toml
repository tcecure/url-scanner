[project]
name = "tcescan"
version = "0.1.0"
description = "TCecure External Exposure Snapshot worker"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<0.29",
    "dnspython>=2.6,<3",
    "jinja2>=3.1,<4",
    "cryptography>=42,<46",
    "weasyprint>=62,<64",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.25",
    "ruff>=0.5,<0.7",
    "mypy>=1.10,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tcescan*"]

[tool.setuptools.package-data]
tcescan = ["templates/*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# UP017 (datetime.UTC) is skipped so the package still imports on 3.10 hosts.
ignore = ["S101", "E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

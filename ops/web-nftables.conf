#!/usr/sbin/nft -f
# Web VM host policy. The application listens on 3000 and PostgreSQL on 5432;
# neither is for the lab at large. Only the nginx edge may reach the application
# and only the worker VM may reach the database.
#
# Install as /etc/nftables.conf, then: nft -f /etc/nftables.conf && systemctl enable --now nftables
# Never run `nft flush ruleset` on this host; see the note below.
#
# Docker publishes ports through its own nat/filter chains, so the rules that
# matter for published ports live in the forward hook, not input.

# Replace only this table on reload. `flush ruleset` would also delete the nat
# and filter chains Docker installs for published ports, which silently breaks
# every container until the daemon is restarted.
table inet filter
delete table inet filter

define edge   = 192.168.1.55
define worker = 192.168.60.10
define admin  = 192.168.1.0/24

table inet filter {
        chain input {
                type filter hook input priority 0; policy drop;
                ct state established,related accept
                ct state invalid drop
                iif lo accept
                ip saddr $admin tcp dport 22 accept
                ip protocol icmp icmp type echo-request accept
                # The containers' own traffic to the host (DNS, the database
                # health check) arrives on Docker's bridges.
                iifname "docker0" accept
                iifname "br-*" accept
        }

        chain forward {
                type filter hook forward priority 0; policy accept;
                # Published container ports arrive here after Docker's DNAT, so
                # the original destination port is the container's.
                ct state established,related accept
                iifname "docker0" accept
                oifname "br-*" ct state new tcp dport 3000 ip saddr != $edge drop
                oifname "br-*" ct state new tcp dport 5432 ip saddr != $worker drop
        }
}

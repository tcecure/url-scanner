#!/usr/sbin/nft -f
# Worker VM host policy. The application already refuses non-public targets;
# this is the same rule expressed where a bug in the application cannot reach.
#
# Install as /etc/nftables.conf, then: nft -f /etc/nftables.conf && systemctl enable --now nftables
# Never run `nft flush ruleset` on this host; see the note below.
#
# Anything the worker is allowed to reach is listed here explicitly. Everything
# else — the Proxmox management network, the student pods, the domain
# controllers, AWX, Guacamole, CDW, the portal — is denied, including when the
# destination arrives by DNS answer rather than configuration.
#
# The worker runs in a container, so its traffic leaves through the forward
# hook; the host's own traffic leaves through output. Both are fenced the same
# way. Building images or installing packages needs more than this allows: do
# that with the ruleset flushed, in a maintenance window.

# Replace only this table on reload. `flush ruleset` would also delete the nat
# and filter chains Docker installs, which silently breaks every container until
# the daemon is restarted.
table inet filter
delete table inet filter

define db_host   = 192.168.1.120
define host_gw   = 192.168.60.1
define resolvers = { 1.1.1.1, 8.8.8.8 }

define private4 = {
        0.0.0.0/8,
        10.0.0.0/8,
        100.64.0.0/10,
        127.0.0.0/8,
        169.254.0.0/16,
        172.16.0.0/12,
        192.0.0.0/24,
        192.0.2.0/24,
        192.168.0.0/16,
        198.18.0.0/15,
        198.51.100.0/24,
        203.0.113.0/24,
        224.0.0.0/4,
        240.0.0.0/4
}

define private6 = {
        ::1/128,
        ::/128,
        ::ffff:0:0/96,
        64:ff9b::/96,
        100::/64,
        2001:db8::/32,
        fc00::/7,
        fe80::/10,
        ff00::/8
}

table inet filter {
        chain input {
                type filter hook input priority 0; policy drop;
                ct state established,related accept
                ct state invalid drop
                iif lo accept
                # Management: the web VM, and the Proxmox host that carries this
                # VM's only network and is the sole path onto it.
                ip saddr { $db_host, $host_gw } tcp dport 22 accept
                ip protocol icmp icmp type echo-request accept
                # The container's traffic to the host (DNS) arrives on Docker's
                # bridges.
                iifname "docker0" accept
                iifname "br-*" accept
        }

        chain forward {
                # The worker's own egress, after Docker's NAT.
                type filter hook forward priority 0; policy drop;
                ct state established,related accept
                ct state invalid drop

                # The queue.
                ip daddr $db_host tcp dport 5432 accept

                # Name resolution, to the public resolvers only. The lab's own
                # resolvers answer for internal names and are not reachable.
                ip daddr $resolvers udp dport 53 accept
                ip daddr $resolvers tcp dport 53 accept

                # Public observation traffic: web ports to public addresses only.
                ip  daddr $private4 counter drop comment "no private IPv4 targets"
                ip6 daddr $private6 counter drop comment "no private IPv6 targets"
                tcp dport { 80, 443 } accept

                counter comment "denied worker egress (container)"
        }

        chain output {
                type filter hook output priority 0; policy drop;
                ct state established,related accept
                oif lo accept

                ip daddr $db_host tcp dport 5432 accept
                ip daddr $resolvers udp dport 53 accept
                ip daddr $resolvers tcp dport 53 accept

                ip  daddr $private4 counter drop comment "no private IPv4 targets"
                ip6 daddr $private6 counter drop comment "no private IPv6 targets"
                tcp dport { 80, 443 } accept

                counter comment "denied worker egress (host)"
        }
}

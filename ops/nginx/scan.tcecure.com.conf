# Edge vhost for the existing nginx host (192.168.1.55), which already fronts
# the lab over DNS -> 108.31.169.90 -> here. Install as
# /etc/nginx/sites-available/scan.tcecure.com and symlink into sites-enabled.
#
# certbot --nginx -d scan.tcecure.com rewrites the listen/ssl_certificate lines
# below once the public A record exists. Until then see the staging block at the
# bottom of this file.

limit_req_zone $binary_remote_addr zone=scan_submit:10m rate=10r/m;

upstream tcescan_web {
    server 192.168.1.120:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name scan.tcecure.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scan.tcecure.com;

    ssl_certificate     /etc/letsencrypt/live/scan.tcecure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scan.tcecure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:scan_tls:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # A free snapshot request is not a large upload.
    client_max_body_size 64k;
    client_body_timeout 15s;

    access_log /var/log/nginx/scan.tcecure.com.access.log;
    error_log  /var/log/nginx/scan.tcecure.com.error.log;

    # Reviewer pages are not for the public internet. The application also
    # requires a staff session; this keeps the login form itself off the public
    # surface. Adjust to the office/lab ranges that should reach it.
    location /staff {
        allow 192.168.1.0/24;
        deny all;
        proxy_pass http://tcescan_web;
        include /etc/nginx/snippets/tcescan-proxy.conf;
    }

    location = /api/requests {
        limit_req zone=scan_submit burst=5 nodelay;
        proxy_pass http://tcescan_web;
        include /etc/nginx/snippets/tcescan-proxy.conf;
    }

    location / {
        proxy_pass http://tcescan_web;
        include /etc/nginx/snippets/tcescan-proxy.conf;
    }
}


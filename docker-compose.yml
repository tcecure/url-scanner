# Two deployment units: this file runs the web tier and database on the web VM,
# and the worker on its own isolated VM (see docker-compose.worker.yml). Running
# both here is only for local work.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcescan}
      POSTGRES_USER: ${POSTGRES_USER:-tcescan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Reachable from the worker VM only; never published to the internet.
    ports:
      - '${DB_BIND:-127.0.0.1}:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tcescan} -d ${POSTGRES_DB:-tcescan}']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: tools
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    # nginx on the edge terminates TLS and proxies to this port.
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db-data:
